[project]
name = "izip2webpzip"
version = "0.1.0"
description = "convert zip file containing image files to zip of WebP images, in-memory"
authors = [{ name = "hy20191108", email = "zwwp9976@gmail.com" }]
dependencies = [
    "tqdm>=4.66.4",
    "natsort>=6.2.0",
    "pillow>=10.3.0",
    "pillow-avif-plugin>=1.4.3",
    "pillow-heif>=0.16.0",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.scripts]
izip2webpzip = "izip2webpzip.izip2webpzip:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/izip2webpzip"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.14.6",
    "mypy>=1.18.2",
]

[project.urls]
Homepage = "https://github.com/hy20191108/izip2webpzip"
